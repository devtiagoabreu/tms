{% extends "base.html" %}
{% block content %}
<h2>Stop History</h2>
<p class="muted">/api/screens/stophistory</p>
<div class="card">
  <form id="f" class="form-row">
    <label>de <input name="day_from"></label><label>até <input name="day_to"></label><label>mac <input name="mac_name"></label>
    <button>buscar</button><button type="button" id="csv">CSV</button>
  </form>
</div>
<div class="card"><pre id="out"></pre></div>
<script type="module">
  import {qs,fetchJSON} from '/static/js/tms.js';
  const f=document.getElementById('f'), out=document.getElementById('out');
  f.onsubmit=async e=>{e.preventDefault();const q=qs(Object.fromEntries(new FormData(f)));const r=await fetchJSON(`/api/screens/stophistory?${q}`);out.textContent=JSON.stringify(r.json,null,2);};
  document.getElementById('csv').onclick=()=>window.location=`/api/screens/stophistory.csv?${qs(Object.fromEntries(new FormData(f)))}`;
</script>
{% endblock %}
