{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1 class="page-title">Histórico de Paradas</h1>
  <p class="page-sub">Histórico de paradas por intervalo — <code>/api/screens/stophistory</code></p>
</div>

<div class="card">
  <div class="card-head">
    <h2 class="card-title">Filtros</h2>
  </div>
  <form id="f" class="form-row">
    <div class="field">
      <label for="day_from">De</label>
      <input id="day_from" name="day_from" placeholder="2025.10.01">
    </div>
    <div class="field">
      <label for="day_to">Até</label>
      <input id="day_to" name="day_to" placeholder="2025.10.01">
    </div>
    <div class="field">
      <label for="mac_name">Mac</label>
      <input id="mac_name" name="mac_name" placeholder="00001">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="row">
        <button class="btn btn-primary" type="submit">Buscar</button>
        <button class="btn" type="button" id="csv">CSV</button>
      </div>
    </div>
  </form>
</div>

<div class="card">
  <div class="card-head">
    <h2 class="card-title">Resposta</h2>
    <div class="status-line" id="st" style="margin:0"></div>
  </div>
  <pre id="out">Execute uma busca para ver o resultado.</pre>
</div>

<script type="module">
  import { qs, fetchJSON, setStatus } from '/static/js/tms.js';

  const f = document.getElementById('f');
  const out = document.getElementById('out');
  const st = document.getElementById('st');

  f.onsubmit = async (e) => {
    e.preventDefault();
    const q = qs(Object.fromEntries(new FormData(f)));
    setStatus(st, 'carregando…');
    const r = await fetchJSON(`/api/screens/stophistory?${q}`);
    if (!r.ok) {
      setStatus(st, `erro ${r.status}`, 'danger');
      out.textContent = r.text || 'Erro na requisição.';
      return;
    }
    setStatus(st, 'ok', 'success');
    out.textContent = JSON.stringify(r.json, null, 2);
  };

  document.getElementById('csv').onclick = () => {
    window.location = `/api/screens/stophistory.csv?${qs(Object.fromEntries(new FormData(f)))}`;
  };
</script>
{% endblock %}
