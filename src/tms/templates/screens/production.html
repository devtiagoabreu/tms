{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1 class="page-title">Produção</h1>
  <p class="page-sub">Produção por loom/operador — <code>/api/screens/production</code></p>
</div>

<div class="card">
  <div class="card-head">
    <h2 class="card-title">Filtros</h2>
  </div>
  <form id="f" class="form-row">
    <div class="field">
      <label for="period">Período</label>
      <select id="period" name="period">
        <option value="day">day</option>
        <option value="shift">shift</option>
        <option value="week">week</option>
        <option value="month">month</option>
      </select>
    </div>
    <div class="field">
      <label for="mode">Modo</label>
      <select id="mode" name="mode">
        <option value="shift">shift</option>
        <option value="operator">operator</option>
      </select>
    </div>
    <div class="field">
      <label for="unit">Unidade</label>
      <select id="unit" name="unit">
        <option value="0">Pick</option>
        <option value="1">Meter</option>
        <option value="2">Yard</option>
      </select>
    </div>
    <div class="field">
      <label for="key">Key</label>
      <input id="key" name="key" placeholder="2025.10.01">
    </div>
    <div class="field">
      <label for="mac_name">Mac</label>
      <input id="mac_name" name="mac_name" placeholder="00001">
    </div>
    <div class="field">
      <label for="day_from">De</label>
      <input id="day_from" name="day_from" placeholder="2025.10.01">
    </div>
    <div class="field">
      <label for="day_to">Até</label>
      <input id="day_to" name="day_to" placeholder="2025.10.01">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="row">
        <button class="btn btn-primary" type="submit">Buscar</button>
        <button class="btn" type="button" id="csv">CSV</button>
      </div>
    </div>
  </form>
</div>

<div class="card">
  <div class="card-head">
    <h2 class="card-title">Resultados</h2>
    <div class="status-line" id="st" style="margin:0"></div>
  </div>
  <div class="table-wrap">
    <table id="t">
      <thead>
        <tr>
          <th>Date</th><th>Loom/Op</th><th>Style</th>
          <th class="text-right">Product</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { qs, fetchJSON, fmtNumber, esc, setStatus } from '/static/js/tms.js';

  const f = document.getElementById('f');
  const st = document.getElementById('st');
  const tbody = document.querySelector('#t tbody');

  f.onsubmit = async (e) => {
    e.preventDefault();
    const q = qs(Object.fromEntries(new FormData(f)));
    setStatus(st, 'carregando…');
    const r = await fetchJSON(`/api/screens/production?${q}`);
    if (!r.ok) { setStatus(st, `erro ${r.status}`, 'danger'); return; }
    const rows = r.json?.rows || [];
    setStatus(st, `${rows.length} linha${rows.length === 1 ? '' : 's'}`, 'success');
    tbody.innerHTML = rows.length ? '' : '<tr><td colspan="4" class="muted">Sem dados</td></tr>';
    rows.forEach((line) => {
      const tr = document.createElement('tr');
      tr.innerHTML = [
        `<td>${esc(line[0])}</td>`,
        `<td>${esc(line[1])}</td>`,
        `<td>${esc(line[2])}</td>`,
        `<td class="text-right">${fmtNumber(line[3], 1)}</td>`,
      ].join('');
      tbody.appendChild(tr);
    });
  };

  document.getElementById('csv').onclick = () => {
    window.location = `/api/screens/production.csv?${qs(Object.fromEntries(new FormData(f)))}`;
  };
</script>
{% endblock %}
