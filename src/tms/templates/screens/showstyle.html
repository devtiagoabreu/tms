{% extends "base.html" %}
{% block content %}
<h2>Show Style</h2>
<p class="muted">/api/screens/showstyle</p>
<div class="card">
  <form id="f" class="form-row">
    <label>data <select name="data"><option value="shift">shift</option><option value="operator">operator</option></select></label>
    <label>sel_mode <select name="sel_mode"><option value="loom">loom</option><option value="style">style</option></select></label>
    <label>mac <input name="mac_name"></label><label>de <input name="day_from"></label><label>até <input name="day_to"></label>
    <button>buscar</button><button type="button" id="csv">CSV</button>
  </form>
</div>
<div class="card"><pre id="out"></pre></div>
<script type="module">
  import {qs,fetchJSON} from '/static/js/tms.js';
  const f=document.getElementById('f'), out=document.getElementById('out');
  f.onsubmit=async e=>{e.preventDefault();const q=qs(Object.fromEntries(new FormData(f)));const r=await fetchJSON(`/api/screens/showstyle?${q}`);out.textContent=JSON.stringify(r.json,null,2);};
  document.getElementById('csv').onclick=()=>window.location=`/api/screens/showstyle.csv?${qs(Object.fromEntries(new FormData(f)))}`;
</script>
{% endblock %}
