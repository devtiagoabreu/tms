{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1 class="page-title">Monitor</h1>
  <p class="page-sub">Status das máquinas em tempo real — <code>/api/monitor</code></p>
</div>

<div class="card">
  <div class="card-head">
    <h2 class="card-title">Opções</h2>
  </div>
  <form class="form-row" onsubmit="return false">
    <div class="field">
      <label for="ofs">Offline após (s)</label>
      <input id="ofs" type="number" value="900">
    </div>
    <div class="field">
      <label for="lang">Idioma</label>
      <input id="lang" value="pt">
    </div>
    <div class="field">
      <label for="timeout">Timeout (s)</label>
      <input id="timeout" type="number" value="5" step="0.5">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="row">
        <label class="row" style="gap:6px"><input type="checkbox" id="live" style="min-width:0"> live</label>
        <label class="row" style="gap:6px"><input type="checkbox" id="stored" style="min-width:0"> stored</label>
      </div>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button class="btn btn-primary" id="refresh">Atualizar</button>
    </div>
  </form>
</div>

<div class="card">
  <div class="card-head">
    <h2 class="card-title">Máquinas</h2>
    <div class="status-line" id="status" style="margin:0"></div>
  </div>
  <div class="grid" id="grid">
    <p class="muted">Carregando…</p>
  </div>
</div>

<script type="module">
  import { qs, fetchJSON, fmtNumber, fmtDate, esc, setStatus } from '/static/js/tms.js';

  const grid = document.getElementById('grid');
  const status = document.getElementById('status');

  function stopInfo(s) {
    if (!s) return '';
    return `<div class="muted">parada: ${esc(s.cause || '')} (${fmtNumber(s.duration_min, 1)} min)</div>`;
  }

  function liveInfo(l) {
    if (!l) return '';
    return `<div class="muted">live: ${esc(l.status)} | rpm ${esc(l.rpm) || '-'} | eff ${fmtNumber(l.efficiency, 1)}% | 24h ${fmtNumber(l.efficiency_24h, 1)}%</div>`;
  }

  function card(m) {
    const div = document.createElement('section');
    div.className = 'link-card';
    div.innerHTML = `
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <h3 style="margin:0">${esc(m.mac_name)}</h3>
        <span style="color:${esc(m.color)};font-weight:600;font-size:0.8125rem">${esc(m.state_label)}</span>
      </div>
      <p>${esc(m.mac_type)} · visto ${fmtDate(m.last_seen)} (há ${fmtNumber(m.age_min, 1)} min)</p>
      <p>eff ${fmtNumber(m.efficiency, 1)}% · rpm ${fmtNumber(m.rpm, 1)} · prod ${esc(m.production) || '-'} · turno ${esc(m.shift_id) || '-'}</p>
      ${stopInfo(m.stop)}
      ${liveInfo(m.live)}
      <p class="muted" style="margin-top:6px">source: ${esc(m.source)}</p>`;
    return div;
  }

  async function load() {
    setStatus(status, 'carregando…');
    const params = qs({
      offline_after_s: document.getElementById('ofs').value,
      lang: document.getElementById('lang').value,
      live: document.getElementById('live').checked ? 'true' : '',
      stored: document.getElementById('stored').checked ? 'true' : '',
      timeout: document.getElementById('timeout').value,
    });

    const res = await fetchJSON(`/api/monitor?${params}`);
    if (!res.ok) {
      setStatus(status, `erro ${res.status}`, 'danger');
      grid.innerHTML = '<p class="muted">Erro ao carregar o monitor.</p>';
      return;
    }

    const rows = res.json || [];
    setStatus(status, `${rows.length} máquina${rows.length === 1 ? '' : 's'}`, 'success');
    grid.innerHTML = '';
    if (!rows.length) {
      grid.innerHTML = '<p class="muted">Nenhuma máquina encontrada.</p>';
      return;
    }
    rows.forEach((m) => grid.appendChild(card(m)));
  }

  document.getElementById('refresh').onclick = load;
  load();
  setInterval(load, 30000);
</script>
{% endblock %}
