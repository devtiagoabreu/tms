{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1 class="page-title">Relatórios</h1>
  <p class="page-sub">Consultas por dia, semana e mês — <code>/api/reports/{period}</code></p>
</div>

<div class="card">
  <div class="card-head">
    <h2 class="card-title">Filtros</h2>
  </div>
  <form id="reportForm" class="form-row">
    <div class="field">
      <label for="period">Período</label>
      <select id="period" name="period">
        <option value="day" selected>day</option>
        <option value="week">week</option>
        <option value="month">month</option>
      </select>
    </div>
    <div class="field">
      <label for="key">Key</label>
      <input id="key" name="key" placeholder="2025.10.01 / 2025.41 / 2025.10">
    </div>
    <div class="field">
      <label for="mac_name">MAC</label>
      <input id="mac_name" name="mac_name" placeholder="00001">
    </div>
    <div class="field">
      <label for="day_from">De</label>
      <input id="day_from" name="day_from" placeholder="2025.10.01">
    </div>
    <div class="field">
      <label for="day_to">Até</label>
      <input id="day_to" name="day_to" placeholder="2025.10.01">
    </div>
    <div class="field">
      <label for="unit">Unidade</label>
      <select id="unit" name="unit">
        <option value="0">Pick</option>
        <option value="1">Meter</option>
        <option value="2">Yard</option>
      </select>
    </div>
    <div class="field">
      <label for="beam_type">Beam</label>
      <select id="beam_type" name="beam_type">
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div class="row">
        <button class="btn btn-primary" type="submit">Buscar</button>
        <button class="btn" type="button" id="csvBtn">CSV</button>
      </div>
    </div>
  </form>
</div>

<div class="card">
  <div class="card-head">
    <div>
      <h2 class="card-title">Resultados</h2>
      <p class="muted" style="margin:4px 0 0;font-size:0.8125rem">Dados filtrados por período</p>
    </div>
    <div class="status-line" id="status" style="margin:0"></div>
  </div>
  <div class="card-body">
    <div class="table-wrap">
      <table id="table">
        <thead>
          <tr>
            <th>Período</th><th>Key</th><th>MAC</th><th>Tipo</th><th>Artigo</th>
            <th class="text-right">Produção</th><th class="text-right">Eficiência</th><th class="text-right">RPM</th>
            <th class="text-right">Rodando</th><th class="text-right">Parado</th><th class="text-right">Total CT</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
    </div>
  </div>
</div>

<script type="module">
  import { qs, fetchJSON, fmtNumber, fmtInt, esc, setStatus } from '/static/js/tms.js';

  const form = document.getElementById('reportForm');
  const tbody = document.querySelector('#table tbody');
  const status = document.getElementById('status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const obj = Object.fromEntries(new FormData(form).entries());
    const period = obj.period || 'day';
    setStatus(status, 'carregando…');

    const res = await fetchJSON(`/api/reports/${encodeURIComponent(period)}?${qs(obj)}`);
    if (!res.ok) {
      setStatus(status, `erro ${res.status}`, 'danger');
      tbody.innerHTML = '<tr><td colspan="11" class="muted">Erro na consulta</td></tr>';
      return;
    }

    const rows = res.json || [];
    setStatus(status, `${rows.length} linha${rows.length === 1 ? '' : 's'}`, 'success');
    tbody.innerHTML = rows.length ? '' : '<tr><td colspan="11" class="muted">Sem dados</td></tr>';

    rows.slice(0, 500).forEach((r) => {
      const tr = document.createElement('tr');
      tr.innerHTML = [
        `<td>${esc(r.period)}</td>`,
        `<td>${esc(r.key)}</td>`,
        `<td>${esc(r.mac_name)}</td>`,
        `<td>${esc(r.mac_type)}</td>`,
        `<td>${esc(r.style)}</td>`,
        `<td class="text-right">${fmtNumber(r.production, 1)}</td>`,
        `<td class="text-right">${fmtNumber(r.effic, 1)}</td>`,
        `<td class="text-right">${fmtNumber(r.rpm, 1)}</td>`,
        `<td class="text-right">${fmtInt(r.run_tm)}</td>`,
        `<td class="text-right">${fmtInt(r.stop_ttm)}</td>`,
        `<td class="text-right">${esc(r.total_ct)}</td>`,
      ].join('');
      tbody.appendChild(tr);
    });
  });

  document.getElementById('csvBtn').addEventListener('click', () => {
    const obj = Object.fromEntries(new FormData(form).entries());
    const period = obj.period || 'day';
    window.location = `/api/reports/${encodeURIComponent(period)}.csv?${qs(obj)}`;
  });
</script>
{% endblock %}
